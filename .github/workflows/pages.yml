name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Verify and build production site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          # Rebuild the last known-good public bundle.
          cat \
            deploy/v2.part00 deploy/v2.part01 deploy/v2.part02 deploy/v2.part03 \
            deploy/v2.part04 deploy/v2.part05 deploy/v2.part06 deploy/v2.part07 \
            deploy/v2.part08 deploy/v2.part09 deploy/v2.part10 deploy/v2.part11 \
            | base64 --decode > /tmp/studieplan-v2.tgz
          echo "88a9efb948418daef33502cb2435e46310a2d6a0d188b06e8a4f8e2c70fd0118  /tmp/studieplan-v2.tgz" | sha256sum -c -
          gzip -t /tmp/studieplan-v2.tgz
          tar -xzf /tmp/studieplan-v2.tgz -C _site

          # Apply the tested Google sync/color/status/reload fix.
          cat deploy/v4.patch.part00 deploy/v4.patch.part01 | base64 --decode > /tmp/studieplan-v4.patch.gz
          echo "4e049d0f06613acfcd2afc377ab0b587efa1ebce719a299d71854c4dd8ff4cb0  /tmp/studieplan-v4.patch.gz" | sha256sum -c -
          gzip -t /tmp/studieplan-v4.patch.gz
          gzip -dc /tmp/studieplan-v4.patch.gz | patch -p1 -d _site

          # Add the hidden two-course rich-text notes page.
          python3 tools/apply_notes.py _site

          # Replace the old line-height dropdown with Goodnotes-style spacing controls.
          python3 tools/apply_goodnotes_spacing.py _site

          # Keep Redigera aktivitet open until Delete, Cancel, or Save is chosen.
          python3 tools/apply_locked_edit_modal.py _site

          # Add statistics, click-to-create, wider days, Dual mode, quick links and mobile View mode.
          base64 --decode deploy/feature_pack.py.gz.b64 > /tmp/feature_pack.py.gz
          echo "235cf62cc1ea628987e4a61040fae6afb7b57aa23416a407ec77dfa89f97129f  /tmp/feature_pack.py.gz" | sha256sum -c -
          gzip -t /tmp/feature_pack.py.gz
          gzip -dc /tmp/feature_pack.py.gz > /tmp/apply_feature_pack.py
          echo "35e94a07c37d4efe3dd75ecee655b680336f28e64ca0fd3d812731debb0ab0fe  /tmp/apply_feature_pack.py" | sha256sum -c -
          python3 /tmp/apply_feature_pack.py _site

          # Keep note heading sizes deterministic, add Word-style text colors, and mirror selected formatting in the toolbar.
          python3 tools/apply_notes_editor_fix.py _site

          # Pin Google sync to one browser-local account and require a user click for OAuth.
          python3 tools/apply_google_account_lock.py _site

          # Add the mechatronics app icon/favicon.
          python3 tools/apply_app_icon.py _site

          # Apply the mechatronics-inspired visual theme last; note content formatting remains untouched.
          python3 tools/apply_mechatronics_theme.py _site

          test -s _site/index.html
          test -s _site/app.js
          test -s _site/cloud-sync.js
          test -s _site/service-worker.js
          test -s _site/favicon.png
          test -s _site/app-icon-192.png
          grep -q 'favicon.png?v=3' _site/index.html
          grep -q 'app-icon-192.png?v=2' _site/index.html
          grep -q 'rel="icon"' _site/index.html
          grep -q 'Mechatronics UI theme' _site/index.html
          grep -q -- '--mech-cyan:#22c7df' _site/index.html
          grep -q '.notes-editor{' _site/index.html
          grep -q 'background:#fff;' _site/index.html
          node --check _site/app.js
          node --check _site/cloud-sync.js
          node --check _site/service-worker.js

          # Existing feature guards.
          grep -q 'eventLabelVersion=1' _site/cloud-sync.js
          grep -q 'ensureCategoryLabels' _site/cloud-sync.js
          grep -q 'tryAutoReconnect' _site/cloud-sync.js
          grep -q "GOOGLE_SYNC_ACCOUNT_KEY='studieplan-google-sync-account'" _site/cloud-sync.js
          grep -q "openid email" _site/cloud-sync.js
          grep -q "login_hint" _site/cloud-sync.js
          grep -q "account_mismatch" _site/cloud-sync.js
          grep -q "Automatisk inloggnings-popup är avstängd" _site/cloud-sync.js
          grep -q "function renderSyncAccountControl()" _site/cloud-sync.js
          if grep -q "requestAccessToken(false,'none')" _site/cloud-sync.js; then
            echo 'Unsafe automatic OAuth popup path detected' >&2
            exit 1
          fi
          if grep -q "setTimeout(tryAutoReconnect" _site/cloud-sync.js; then
            echo 'Startup auto-reconnect popup path detected' >&2
            exit 1
          fi
          grep -q 'Studieplan status' _site/cloud-sync.js
          grep -q 'studieplan-shell-v2' _site/service-worker.js
          grep -q 'id="notesPage"' _site/index.html
          grep -q 'id="notesET4012"' _site/index.html
          grep -q 'id="notesMA4026"' _site/index.html
          grep -q 'function queueNotesSave()' _site/app.js
          grep -q 'x.notes.ET4012' _site/app.js
          grep -q 'data-spacing-range' _site/index.html
          grep -q 'data-spacing-auto' _site/index.html
          grep -q 'function initGoodnotesSpacing()' _site/app.js
          grep -q 'function applyGoodnotesSpacing' _site/app.js
          grep -q 'font-size:32px!important' _site/index.html
          grep -q 'font-size:28px!important' _site/index.html
          grep -q 'font-size:24px!important' _site/index.html
          grep -q 'data-note-color-panel' _site/index.html
          grep -q 'data-note-theme-colors' _site/index.html
          grep -q 'data-note-standard-colors' _site/index.html
          grep -q 'Fler färger' _site/index.html
          grep -q 'function initWordNoteColors()' _site/app.js
          grep -q 'function syncNoteColorUi' _site/app.js
          grep -q 'function syncNoteToolbar(course)' _site/app.js
          grep -q 'function initNoteToolbarSync()' _site/app.js
          grep -q 'initWordNoteColors();initNoteToolbarSync();' _site/app.js
          grep -q "function closeEventModal(reason='other')" _site/app.js
          grep -Fq "const allowed=editingId?['delete','cancel','save']:['cancel','save']" _site/app.js
          grep -q "closeEventModal('cancel')" _site/app.js
          grep -q "closeEventModal('save')" _site/app.js
          grep -q "closeEventModal('delete')" _site/app.js
          grep -q "closeEventModal('backdrop')" _site/app.js
          grep -Fq "e.key==='Escape'&&!$('eventModalBack').classList.contains('hidden')" _site/app.js

          # New feature guards.
          grep -q 'id="statsPage"' _site/index.html
          grep -q 'id="dualModeBtn"' _site/index.html
          grep -q 'id="quickLinkBtn1"' _site/index.html
          grep -q 'id="quickLinkBtn2"' _site/index.html
          grep -q 'id="mobileViewPage"' _site/index.html
          grep -q 'function renderCalendarEnhanced()' _site/app.js
          grep -q 'function openAddAt' _site/app.js
          grep -q 'function renderStats()' _site/app.js
          grep -q 'Ej klart hittills' _site/app.js
          grep -q 'const STUDIEPLAN_VIEW_MODE=' _site/app.js
          grep -q 'async function syncViewFromDrive' _site/cloud-sync.js
          grep -q "window.STUDIEPLAN_VIEW_MODE?'https://www.googleapis.com/auth/drive.appdata':GOOGLE_SCOPES" _site/cloud-sync.js
          grep -q "View mode är read only och skriver inte till Google Drive" _site/cloud-sync.js

          # Privacy guards: never publish embedded personal schedule/backup data.
          if grep -q 'study-001' _site/index.html; then
            echo 'Private schedule data detected in public build' >&2
            exit 1
          fi
          if grep -R -q 'ET-F01 · R1' _site; then
            echo 'Private backup content detected in public build' >&2
            exit 1
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
