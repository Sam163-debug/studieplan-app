name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Verify and build production site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cat \
            deploy/v2.part00 deploy/v2.part01 deploy/v2.part02 deploy/v2.part03 \
            deploy/v2.part04 deploy/v2.part05 deploy/v2.part06 deploy/v2.part07 \
            deploy/v2.part08 deploy/v2.part09 deploy/v2.part10 deploy/v2.part11 \
            | base64 --decode > /tmp/studieplan-v2.tgz
          echo "88a9efb948418daef33502cb2435e46310a2d6a0d188b06e8a4f8e2c70fd0118  /tmp/studieplan-v2.tgz" | sha256sum -c -
          gzip -t /tmp/studieplan-v2.tgz
          tar -xzf /tmp/studieplan-v2.tgz -C _site

          cat deploy/v3.patch.part00 deploy/v3.patch.part01 | base64 --decode > /tmp/studieplan-v3.patch.gz
          echo "3adea9f187fa25ce003812c0616ed73eacd241431bb411367bab4ee9072f3192  /tmp/studieplan-v3.patch.gz" | sha256sum -c -
          gzip -t /tmp/studieplan-v3.patch.gz
          gzip -dc /tmp/studieplan-v3.patch.gz | patch -p1 -d _site

          test -s _site/index.html
          test -s _site/app.js
          test -s _site/cloud-sync.js
          node --check _site/app.js
          node --check _site/cloud-sync.js
          node --check _site/service-worker.js
          grep -q 'eventLabelVersion=1' _site/cloud-sync.js
          grep -q 'tryAutoReconnect' _site/cloud-sync.js
          grep -q 'Studieplan status' _site/cloud-sync.js
          if grep -q 'study-001' _site/index.html; then
            echo 'Private schedule data detected in public build' >&2
            exit 1
          fi
          if grep -R -q 'ET-F01 · R1' _site; then
            echo 'Private backup content detected in public build' >&2
            exit 1
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
